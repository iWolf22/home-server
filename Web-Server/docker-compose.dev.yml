name: personal-website-development

services:
    # =============================================
    # Personal Website
    # =============================================
    nextjs:
        container_name: nextjs
        build:
            context: .
            target: dev
        restart: always
        command: "npm run dev"
        volumes:
            - nextjs-node-modules-folder:/app/node_modules
            - nextjs-next-folder:/app/.next
        ports:
            - 3000:3000
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.personal.rule=Host(`personal.localhost`)"
            - "traefik.http.routers.personal.entrypoints=web"

    traefik:
        image: "traefik:v3.3"
        container_name: "traefik"
        command:
            #- "--log.level=DEBUG"
            - "--api.insecure=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--entryPoints.web.address=:80"
        ports:
            - "80:80"
            - "8080:8080"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"

