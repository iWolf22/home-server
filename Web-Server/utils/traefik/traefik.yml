api:
  insecure: false
  dashboard: false

log:
  level: DEBUG

accessLog:
  format: "common"

providers:
  docker:
    exposedByDefault: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  myresolver:
    acme:
      email: joshua.dierickse@gmail.com
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: web
