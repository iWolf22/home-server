user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    # Upgrade WebSocket if requested, otherwise use keepalive
    map $http_upgrade $connection_upgrade_keepalive {
        default upgrade;
        '' '';
    }

    # This is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream where your authentik server is hosted.
    upstream authentik {
        server server:9443;
        # Improve performance by keeping some connections alive.
        keepalive 10;
    }

    upstream grafana {
        server grafana:3000;
    }

    limit_req_zone $binary_remote_addr zone=ip:10m rate=5r/s;

    server {
        listen 80 default_server;
        server_name _;

        location / {
            proxy_pass http://nextjs:3000;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # https://github.com/vercel/next.js/issues/36774#issuecomment-2211808405
        location /_next/webpack-hmr {
            proxy_pass http://nextjs:3000/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Proxy site
        # Location can be set to a subpath if desired, see documentation linked below:
        # https://goauthentik.io/docs/installation/configuration#authentik_web__path
        location /authentik {
            proxy_pass http://authentik;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade_keepalive;
        }

        location /grafana {
            proxy_set_header Host $host;
            proxy_pass http://grafana;
        }

        # Proxy Grafana Live WebSocket connections.
        location /grafana/api/live {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_pass http://grafana;
        }
    }
}
