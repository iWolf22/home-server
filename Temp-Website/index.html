<!DOCTYPE html>
<html lang="en" style="padding: 0px; margin: 0px">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
			rel="stylesheet"
		/>
		<title>Joshua Dierickse</title>
	</head>

	<style>
		body {
			background: linear-gradient(
				-45deg,
				#ee7752,
				#e73c7e,
				#23a6d5,
				#23d5ab
			);
			background-size: 400% 400%;
			animation: gradient 15s ease infinite;
			height: 100vh;
		}

		@keyframes gradient {
			0% {
				background-position: 0% 50%;
			}
			50% {
				background-position: 100% 50%;
			}
			100% {
				background-position: 0% 50%;
			}
		}

		.jetbrains-mono-400 {
			font-family: "JetBrains Mono", monospace;
			font-optical-sizing: auto;
			font-weight: 400;
			font-style: normal;
		}

		.jetbrains-mono-600 {
			font-family: "JetBrains Mono", monospace;
			font-optical-sizing: auto;
			font-weight: 600;
			font-style: normal;
		}
	</style>

	<body style="padding: 0px; margin: 0px">
		<div
			style="
				height: 100vh;
				width: 100vw;
				display: flex;
				justify-content: center;
				align-items: center;
			"
		>
			<div
				style="
					padding: 32px;
					background-color: white;
					border-radius: 8px;
					box-shadow: 0 0 5px #0c0a0944, 0 0 10px #0c0a0944;
					max-width: 600px;
				"
			>
				<h1
					style="padding: 0px; margin: 0px; text-align: center"
					class="jetbrains-mono-600"
				>
					Joshua Dierickse Oracle VPS
				</h1>
				<p
					style="padding: 0px; margin: 0px; margin-top: 16px"
					class="jetbrains-mono-400"
				>
					Greetings wandering visitor, it appears you have found the
					ip address of my Oracle VPS where I occasionally host side
					projects, if you were looking for my personal website you
					can find it
					<a href="https://joshuadierickse.me/" target="_blank"
						>here</a
					>. I hope you find what you are actually looking for and
					have a great day!
				</p>
			</div>
		</div>
	</body>
</html>
